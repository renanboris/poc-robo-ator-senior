<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeniorOS | VLA Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 10px; border: 2px solid #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background-color: #475569; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .pulse-btn { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(6, 182, 212, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
        }

        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        .step-item { opacity: 0; transform: translateX(-20px); transition: all 0.5s ease-out; }
        .step-item.active { opacity: 1; transform: translateX(0); }
    </style>
</head>
<body class="flex h-screen w-full antialiased selection:bg-cyan-500 selection:text-white">

    <aside class="w-64 bg-slate-900 border-r border-slate-800 hidden md:flex flex-col flex-shrink-0 z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-800 flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse"></div>
                <h1 class="text-lg font-semibold tracking-wide text-slate-200">Senior<span class="text-cyan-400">OS</span></h1>
            </div>
        </div>
        <div class="p-4 flex-shrink-0 flex flex-col gap-3">
            <button type="button" onclick="location.reload()" class="w-full flex items-center justify-center gap-2 bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2.5 rounded-lg transition-colors font-medium text-sm shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                Novo Roteiro
            </button>
            <a href="/dashboard.html" class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-600 text-slate-300 px-4 py-2 rounded-lg transition-all font-medium text-sm shadow-sm group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 group-hover:text-cyan-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                Dashboard Clássico
            </a>
        </div>
        <div class="flex-1 overflow-y-auto custom-scroll px-3 py-2 space-y-1">
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-3 mt-4">Sessões Recentes</div>
            <button type="button" class="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors truncate">Aprovação de Férias HCM</button>
            <button type="button" class="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors truncate">Faturamento ERP</button>
        </div>
        <div class="p-4 border-t border-slate-800 flex-shrink-0">
            <div class="flex items-center gap-3 text-sm text-slate-400">
                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold">RK</div>
                Renan Kirsch
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#0b1121] min-w-0 relative">
        <header class="h-14 flex items-center px-4 border-b border-slate-800 bg-slate-900 md:hidden flex-shrink-0 shadow-sm z-20">
            <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse mr-2"></div>
            <h1 class="text-base font-semibold text-slate-200">VLA Agent</h1>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto custom-scroll p-4 sm:p-8 pt-6 relative z-0">
            <div class="max-w-3xl mx-auto space-y-6" id="chat-content">
                </div>
            <div id="scroll-anchor" class="h-24 w-full"></div>
        </div>

        <div class="flex-shrink-0 bg-gradient-to-t from-[#0b1121] via-[#0b1121] to-transparent pt-12 pb-6 px-4 sm:px-6 relative z-10 w-full mt-[-60px]">
            <div class="max-w-3xl mx-auto relative">
                <form id="input-form" class="relative flex items-center shadow-2xl rounded-full bg-slate-800 border border-slate-700/80 focus-within:border-cyan-500 focus-within:ring-1 focus-within:ring-cyan-500 transition-all">
                    <input type="text" id="user-input" autocomplete="off" placeholder="Descreva a sua intenção..." 
                        class="w-full bg-transparent text-slate-200 placeholder-slate-400 rounded-full py-4 pl-6 pr-14 focus:outline-none text-base"
                    >
                    <button type="submit" id="send-btn" class="absolute right-2 p-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-full transition-colors flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </form>
                <div class="text-center mt-3 text-[11px] text-slate-500 font-medium">VLA Engine (Visual Learning Agent) | Sincronizado com API Local</div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE_URL = "http://localhost:8000"; 

        const chatContent = document.getElementById('chat-content');
        const chatContainer = document.getElementById('chat-container');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');

        let appState = "IDLE"; 
        let sessionData = { titulo: "", produto: "", objetivo: "" };

        window.onload = () => {
            addAgentMessage("Olá, Renan. O que vamos construir hoje?");
            showChips([
                { label: "🎬 Construir uma nova aula", action: "start_new" },
                { label: "🎥 Gerar Vídeo de uma aula existente", action: "unsupported" }
            ]);
            userInput.focus();
        };

        inputForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            
            addUserMessage(text);
            userInput.value = '';
            processUserInput(text);
        });

        async function processUserInput(text) {
            showTyping();
            await sleep(600); 
            removeTyping();

            switch(appState) {
                case "IDLE":
                    if(text.toLowerCase().includes("nova") || text.toLowerCase().includes("aula")) {
                        handleChipAction("start_new");
                    } else {
                        addAgentMessage("Por favor, selecione uma das opções acima para iniciarmos a esteira.");
                    }
                    break;

                case "TITLE":
                    sessionData.titulo = text;
                    appState = "PRODUCT";
                    addAgentMessage("Anotado. Para manter a nossa biblioteca organizada, a qual produto esta aula pertence?");
                    showChips([
                        { label: "Senior Flow", action: "set_product" },
                        { label: "HCM", action: "set_product" },
                        { label: "ERP", action: "set_product" }
                    ]);
                    break;

                case "OBJECTIVE":
                    sessionData.objetivo = text;
                    appState = "MAPPING_WAIT";
                    addAgentMessage(`Tudo pronto.\n\n**Título:** ${sessionData.titulo}\n**Tag:** ${sessionData.produto}\n**Objetivo:** ${sessionData.objetivo}\n\n🔴 A acionar o VLA Engine para mapeamento. A janela do sistema vai abrir em instantes...`);
                    
                    iniciarMapeamentoNaAPI();
                    break;

                default:
                    addAgentMessage("Estou a processar a sua solicitação...");
            }
        }

        async function handleChipAction(action, label = "") {
            if(action === "unsupported") {
                addUserMessage(label);
                showTyping(); await sleep(600); removeTyping();
                addAgentMessage("Para a nossa demonstração de hoje, vamos focar em **Construir uma nova aula**.");
                return;
            }

            if(action === "start_new") {
                addUserMessage("🎬 Construir uma nova aula");
                appState = "TITLE";
                showTyping(); await sleep(600); removeTyping();
                addAgentMessage("Excelente. Qual será o título desta aula?");
            }

            if(action === "set_product") {
                addUserMessage(label);
                sessionData.produto = label;
                appState = "OBJECTIVE";
                showTyping(); await sleep(600); removeTyping();
                addAgentMessage("Ótimo. E qual é o objetivo de negócio deste fluxo? (O que o aluno vai aprender a fazer?)");
            }
        }

        async function aguardarProcessoBackend() {
            await sleep(1500); 
            while (true) {
                try {
                    const res = await fetch(`${API_BASE_URL}/api/status`);
                    const status = await res.json();
                    
                    if (status.ocupado === false) {
                        return { 
                            sucesso: !status.erro, 
                            mensagem: status.erro ? status.erro : status.sucesso 
                        };
                    }
                } catch (e) {
                    console.log("A aguardar API...");
                }
                await sleep(2000); 
            }
        }

        function formatarNomeArquivo(nome) {
            return nome.replace(/[\\/*?:"<>|]/g, "").replace(/ /g, "_").substring(0, 40).replace(/_+$/, "") + ".json";
        }

        async function iniciarMapeamentoNaAPI() {
            try {
                await fetch(`${API_BASE_URL}/api/limpar-status`, { method: 'POST' }).catch(() => {});

                const response = await fetch(`${API_BASE_URL}/api/gravar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome_aula: sessionData.titulo, objetivo: sessionData.objetivo })
                });
                
                if (!response.ok) throw new Error("A API rejeitou o comando de gravação.");

                showTyping(); 
                const resultado = await aguardarProcessoBackend();
                removeTyping(); 
                
                await fetch(`${API_BASE_URL}/api/limpar-status`, { method: 'POST' }).catch(() => {});

                appState = "FACTORY_READY";

                if (resultado.sucesso) {
                    addAgentMessage(`Mapeamento concluído com sucesso! O roteiro **${sessionData.titulo}** está guardado na base de dados.\n\nGostaria de iniciar a produção completa dos materiais didáticos?`);
                    
                    const factoryHtml = `
                        <div class="mt-8 mb-4 flex justify-center fade-in" id="box-btn-factory">
                            <button type="button" onclick="iniciarFabricaNaAPI()" class="pulse-btn bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 px-10 rounded-xl shadow-lg transition-all transform hover:scale-[1.02] flex items-center gap-3">
                                <span class="text-2xl">🚀</span> 
                                <span class="tracking-wide">INICIAR LINHA DE PRODUÇÃO</span>
                            </button>
                        </div>
                    `;
                    appendRawHtml(factoryHtml);
                } else {
                    addAgentMessage(`⚠️ O mapeamento foi interrompido ou falhou: ${resultado.mensagem}`);
                }

            } catch (e) {
                console.error(e);
                removeTyping();
                addAgentMessage("⚠️ Falha ao conectar com o Backend VLA. O servidor na porta 8000 está a correr?");
            }
        }

        async function iniciarFabricaNaAPI() {
            const btnBox = document.getElementById('box-btn-factory');
            if(btnBox) btnBox.remove();
            
            addUserMessage("🚀 Iniciar Linha de Produção");
            showTyping(); await sleep(800); removeTyping();
            addAgentMessage("A iniciar a esteira de produção. Acompanhe os processos em tempo real.");

            const stepsId = 'stepper-' + Date.now();
            const stepperHtml = `
                <div id="${stepsId}" class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-6 mt-4 mb-4 space-y-5 shadow-sm fade-in w-full max-w-lg mx-auto md:mx-0">
                </div>
            `;
            appendRawHtml(stepperHtml);
            const container = document.getElementById(stepsId);
            
            const arquivoJson = formatarNomeArquivo(sessionData.titulo);
            const arquivoBase = arquivoJson.replace('.json', '');

            const productionSteps = [
                { msg: "⏳ Montando estúdio e gravando passos (Robô)...", endpoint: `/api/executar-robo/${arquivoJson}`, sleepTime: 5000 },
                { msg: "🎬 Renderizando a magia visual no vídeo (MP4)...", endpoint: `/api/renderizar/${arquivoJson}`, sleepTime: 4000 },
                { msg: "📦 Empacotando o formato SCORM...", endpoint: `/api/gerar-scorm/${arquivoJson}`, sleepTime: 2000 },
                { msg: "📜 Forjando os pergaminhos sagrados (PDF)...", endpoint: `/api/gerar-pdf/${arquivoJson}`, sleepTime: 2000 },
                { msg: "🧠 Farmando XP e indexando na base RAG da Aura...", endpoint: `/api/ingest/${arquivoJson}`, sleepTime: 2500 }
            ];

            for (let i = 0; i < productionSteps.length; i++) {
                const stepDef = productionSteps[i];
                
                const stepEl = document.createElement('div');
                stepEl.className = `step-item flex items-center gap-4 text-slate-300 font-medium text-sm`;
                stepEl.innerHTML = `
                    <div class="w-5 h-5 rounded-full border-2 border-cyan-500 border-t-transparent animate-spin flex-shrink-0"></div>
                    <span>${stepDef.msg}</span>
                `;
                container.appendChild(stepEl);
                void stepEl.offsetWidth; 
                stepEl.classList.add('active');
                scrollToBottom();

                try {
                    await fetch(`${API_BASE_URL}/api/limpar-status`, { method: 'POST' });
                    const res = await fetch(`${API_BASE_URL}${stepDef.endpoint}`, { method: 'POST' });
                    
                    if(res.ok) {
                        const resultadoStep = await aguardarProcessoBackend();
                        if(!resultadoStep.sucesso) {
                            stepEl.children[0].outerHTML = `<span class="text-red-500 text-lg font-bold flex-shrink-0">✗</span>`;
                            stepEl.classList.add("text-red-400");
                            addAgentMessage(`⚠️ **A esteira parou.** Ocorreu um erro no processo: \n\n\`${resultadoStep.mensagem}\``);
                            
                            const retryHtml = `
                                <div class="mt-6 mb-4 flex justify-center fade-in" id="box-btn-factory">
                                    <button type="button" onclick="iniciarFabricaNaAPI()" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg border border-slate-600 transition-colors shadow-md">
                                        🔄 Tentar Linha de Produção Novamente
                                    </button>
                                </div>`;
                            appendRawHtml(retryHtml);
                            return; 
                        }
                    }
                } catch(e) {
                    console.error(`Erro ao chamar ${stepDef.endpoint}`, e);
                }

                await sleep(stepDef.sleepTime); 
                stepEl.children[0].outerHTML = `<div class="w-5 h-5 bg-cyan-500/20 text-cyan-400 rounded-full flex items-center justify-center flex-shrink-0"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>`;
            }

            const finalEl = document.createElement('div');
            finalEl.className = `step-item flex items-center gap-4 font-medium text-cyan-400 font-bold text-lg pt-2`;
            finalEl.innerHTML = `<span>✅ PRODUÇÃO CONCLUÍDA!</span>`;
            container.appendChild(finalEl);
            setTimeout(() => finalEl.classList.add('active'), 50);
            scrollToBottom();

            // --- INÍCIO DA VITRINE DE ENTREGÁVEIS (AGORA VAI APARECER!) ---
            await sleep(1000);
            
            // Sincronizado perfeitamente com as rotas do seu FastAPI (app.py)
            const videoUrl = `/videos/${arquivoBase}.mp4`;
            const pdfUrl = `/api/download-pdf/${arquivoBase}`; 
            const scormUrl = `/api/download-scorm/${arquivoBase}`;  

            const vitrineHtml = `
                <div class="flex gap-4 w-full fade-in mt-4">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex-shrink-0 flex items-center justify-center shadow-md mt-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    </div>
                    <div class="bg-slate-800/80 border border-cyan-500/30 p-5 rounded-2xl rounded-tl-sm w-full max-w-xl shadow-lg">
                        <p class="text-slate-200 mb-4 text-[15px]">Pronto! A esteira finalizou. Aqui estão os materiais gerados para <b>${sessionData.titulo}</b>:</p>

                        <div class="rounded-xl overflow-hidden border border-slate-700 mb-4 bg-black relative group">
                            <video controls class="w-full h-auto max-h-64 object-contain">
                                <source src="${videoUrl}" type="video/mp4">
                                O seu navegador não suporta a visualização do vídeo.
                            </video>
                        </div>

                        <div class="flex flex-wrap gap-3 mb-5">
                            <a href="${pdfUrl}" target="_blank" class="flex items-center gap-2 px-4 py-2.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-lg text-sm text-white transition-colors shadow-sm w-full sm:w-auto justify-center">
                                📄 Baixar PDF
                            </a>
                            <a href="${scormUrl}" target="_blank" class="flex items-center gap-2 px-4 py-2.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-lg text-sm text-white transition-colors shadow-sm w-full sm:w-auto justify-center">
                                📦 Baixar SCORM
                            </a>
                        </div>

                        <div class="h-px w-full bg-slate-700/50 mb-4"></div>

                        <p class="text-slate-400 text-sm mb-3">O que deseja fazer a seguir?</p>
                        <div class="flex flex-col sm:flex-row gap-3">
                            <a href="/dashboard.html" class="flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm text-white font-medium transition-colors shadow-md flex-1 border border-slate-600">
                                ✏️ Refinar no Dashboard
                            </a>
                            <button type="button" onclick="handleChipAction('unsupported', 'Perguntar à Aura')" class="flex items-center justify-center gap-2 px-4 py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 rounded-lg text-sm text-white font-medium transition-colors shadow-md flex-1 border border-cyan-500/50">
                                🧠 Testar a Aura
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            appendRawHtml(vitrineHtml);
            // --- FIM DA VITRINE DE ENTREGÁVEIS ---
        }

        // =======================================================================
        // RENDERIZAÇÃO E SCROLL (FIX)
        // =======================================================================

        function addAgentMessage(text) {
            const formattedText = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>');
            const msg = `
                <div class="flex gap-4 w-full fade-in">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex-shrink-0 flex items-center justify-center shadow-md mt-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    </div>
                    <div class="bg-transparent text-slate-200 text-[15px] leading-relaxed w-fit max-w-[85%] pt-2">
                        ${formattedText}
                    </div>
                </div>
            `;
            appendRawHtml(msg);
        }

        function addUserMessage(text) {
            const msg = `
                <div class="flex gap-4 w-full justify-end fade-in">
                    <div class="bg-slate-800 px-5 py-3 rounded-2xl rounded-tr-sm text-slate-200 text-[15px] shadow-sm w-fit max-w-[85%] border border-slate-700/50">
                        ${text}
                    </div>
                </div>
            `;
            appendRawHtml(msg);
        }

        function showChips(options) {
            let btns = options.map(opt => `
                <button type="button" onclick="handleChipAction('${opt.action}', '${opt.label}')" class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 hover:border-cyan-500/50 rounded-xl text-sm text-slate-300 transition-all shadow-sm flex items-center gap-2">
                    ${opt.label}
                </button>
            `).join('');
            
            const html = `
                <div class="flex gap-3 w-full fade-in ml-13 flex-wrap pl-12 mt-2">
                    ${btns}
                </div>
            `;
            appendRawHtml(html);
        }

        function showTyping() {
            const html = `
                <div id="typing-indicator" class="flex gap-4 w-full fade-in">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex-shrink-0 flex items-center justify-center shadow-md mt-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    </div>
                    <div class="flex items-center gap-1.5 h-9 pt-3">
                        <div class="w-2 h-2 bg-slate-500 rounded-full typing-dot"></div>
                        <div class="w-2 h-2 bg-slate-500 rounded-full typing-dot"></div>
                        <div class="w-2 h-2 bg-slate-500 rounded-full typing-dot"></div>
                    </div>
                </div>
            `;
            appendRawHtml(html);
        }

        function removeTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        function appendRawHtml(html) {
            chatContent.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        // FIX: Scroll robusto com pequeno atraso para o DOM renderizar
        function scrollToBottom() {
            setTimeout(() => {
                const anchor = document.getElementById('scroll-anchor');
                if (anchor) {
                    anchor.scrollIntoView({ behavior: 'smooth', block: 'end' });
                } else {
                    chatContainer.scrollTo({
                        top: chatContainer.scrollHeight,
                        behavior: 'smooth'
                    });
                }
            }, 50);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
